    name: "Apex Commercial Trust"
    short_code: "ACT"
    pattern: "^ACT-FD-[A-Z]{2}-\\d{6}$"
    pattern_example: "ACT-FD-DL-104928"
    branch_locations: ["Delhi-Connaught", "Noida-Sec62", "Chandigarh-Sec17"]
    ifsc_prefix: "ACTR0"
    base_interest_rate_range: [6.5, 7.5]
    compounding_frequency: 4
