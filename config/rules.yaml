# FDR-Sentinel Configuration Rules
# Problem Statement: SIH26265 - Security Deposit / FDR Portal, AICTE
# Note: All institutions and banks are fictional for privacy & synthetic demo compliance.

version: "1.0"

system:
  app_name: "FDR-Sentinel"
  synthetic_banner: "Synthetic demo data. No real bank or AICTE data."
  seed: 42
  default_currency: "INR"

interest_calculation:
  compounding_frequency: 4  # Quarterly compounding default
  formula_description: "maturity = P * (1 + r/4)^(4t)"
  tolerance_percent: 2.0     # 2% rounding and bank convention discrepancy margin

alert_intervals_days: [90, 60, 30, 15, 7]
escalation:
  unacknowledged_days_senior: 7
  high_risk_priority_escalation: true

risk_model:
  high_risk_threshold: 70
  medium_risk_threshold: 40
  feature_weights:
    anomaly_score: 0.25
    flag_severity_weighted: 0.30
    days_to_maturity: 0.15
    institution_history: 0.15
    amount_deviation: 0.15

duplicate_radar:
  fuzzy_ratio_threshold: 85       # pg_trgm / rapidfuzz match
  phash_max_distance: 10          # imagehash pHash max Hamming distance
  match_types:
    - "EXACT_FINGERPRINT"         # SHA256(bank + fdr_number + amount + issue_date)
    - "CROSS_INSTITUTION_REUSE"   # Same FDR claimed by two institutions
    - "POST_RELEASE_REPRESENT"    # FDR resubmitted after release approval
    - "VISUAL_PERCEPTUAL_PHASH"   # Rendered first-page perceptual duplicate

release_eligibility:
  checklist:
    - id: "CHECK_TRUST_L4"
      description: "FDR must be sealed at Trust Ladder L4"
      required: true
    - id: "CHECK_MATURITY"
      description: "FDR must have reached or passed maturity date"
      required: true
    - id: "CHECK_NO_BLOCKING_FLAGS"
      description: "Zero unresolved high-severity forensic anomalies"
      required: true
    - id: "CHECK_NO_DUPLICATE_DISPUTE"
      description: "No active cross-institution duplicate radar flags"
      required: true
    - id: "CHECK_BOARD_APPROVAL"
      description: "Competent AICTE approval signed on file"
      required: true

fictional_banks:
